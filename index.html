<style>
:root{
  --navy:#1A3A6E; --navy-2:#122B54; --navy-3:#E6ECF5;
  --orange:#E8611A; --orange-2:#C94F0F; --orange-3:#FDEEE4;
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#17233A; --muted:#5E6B82; --line:#D8DEE8;
  --ok:#1E8A5A; --ok-3:#E3F4EC; --bad:#C0392B; --bad-3:#FBE7E5;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hidden{display:none!important}

/* ── Topo ── */
.topo{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.topo-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0}
.marca b{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.5px;line-height:1}
.marca b i{font-style:normal;color:var(--orange)}
.marca span{font-family:var(--disp);font-weight:500;font-size:19px;color:#C9D4E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .esp{flex:1}
.btn-topo{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn-topo:hover{background:rgba(255,255,255,.1)}
.sync{font-size:12px;color:#AFC0DA;white-space:nowrap}
.menu{position:relative}
.menu-lista{position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 12px 32px rgba(18,43,84,.25);min-width:200px;padding:6px;z-index:30}
.menu-lista button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:7px;cursor:pointer}
.menu-lista button:hover{background:var(--navy-3)}
.menu-lista .quem{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--muted)}
.menu-lista .quem strong{display:block;color:var(--ink);font-size:14px}

.abas{background:var(--navy-2)}
.abas-in{max-width:1280px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.abas button{background:none;border:0;color:#B8C6DC;padding:12px 16px 11px;font-family:var(--disp);font-weight:600;font-size:18px;letter-spacing:.3px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.abas button[aria-selected="true"]{color:#fff;border-bottom-color:var(--orange)}
.abas button:hover{color:#fff}

main{max-width:1280px;margin:0 auto;padding:22px 18px calc(40px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--disp);font-weight:700;font-size:24px;margin:0 0 12px;color:var(--navy)}
h2 small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);margin-left:8px}
.secao{margin-top:28px}

/* ── Botões ── */
.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:disabled{opacity:.55;cursor:progress}
.btn-pri{background:var(--orange);color:#fff}.btn-pri:hover{background:var(--orange-2)}
.btn-nav{background:var(--navy);color:#fff}.btn-nav:hover{background:var(--navy-2)}
.btn-sec{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn-sec:hover{border-color:var(--navy)}
.btn-txt{background:none;color:var(--muted);padding:11px 10px}.btn-txt:hover{color:var(--bad)}
.btn-del{background:var(--bad-3);color:var(--bad)}.btn-del:hover{background:#F6D3CF}
.btn-g{padding:16px 22px;font-size:17px}

/* ── Operação ── */
.acoes{display:flex;gap:12px;flex-wrap:wrap}
.cards-and{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.and{background:var(--card);border-radius:12px;border-left:6px solid var(--orange);padding:16px 18px 14px;box-shadow:0 1px 2px rgba(18,43,84,.08);display:flex;flex-direction:column;gap:6px}
.and .cli{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.05;color:var(--navy)}
.and .mov{font-size:13px;font-weight:600;color:var(--orange-2)}
.and .meta{font-size:13px;color:var(--muted)}
.relogio{font-family:var(--disp);font-weight:700;font-size:54px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px;color:var(--ink);margin:6px 0 2px}
.relogio.longo{color:var(--bad)}
.and.ret{border-left-color:var(--navy)}
.and .rod .btn{white-space:nowrap}
.and.ret .mov{color:var(--navy)}
.relogio.md{font-size:40px}
.tag.ag{background:var(--orange-3);color:var(--orange-2)}
.ent-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ent-box .tx{flex:1;min-width:200px;font-size:14px}
.ent-box .tx b{display:block;font-family:var(--disp);font-size:18px;color:var(--navy)}
textarea.in{resize:vertical;min-height:70px}
.and .rod{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.vazio{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}
.lista-hoje{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(18,43,84,.08)}
.lh{display:grid;grid-template-columns:120px 1fr 1fr 90px;gap:10px;padding:11px 16px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.lh:first-child{border-top:0}
.lh:hover{background:#F7F9FC}
.lh .h{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.lh .c{font-weight:600}
.lh .t{font-family:var(--disp);font-weight:600;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}

/* ── Filtros / tabela ── */
.filtros{background:var(--card);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;box-shadow:0 1px 2px rgba(18,43,84,.08)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:#fff;min-height:42px}
.in:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--navy-3)}
.in:disabled{background:#F4F6FA;color:var(--ink)}
.resumo{display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 2px 10px;font-size:14px;color:var(--muted)}
.resumo b{font-family:var(--disp);font-size:20px;color:var(--ink);font-weight:700;margin-right:4px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.tab-wrap{background:var(--card);border-radius:12px;overflow-x:auto;box-shadow:0 1px 2px rgba(18,43,84,.08)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{position:sticky;top:0;background:var(--navy-3);color:var(--navy);text-align:left;font-weight:600;font-size:13px;padding:10px 10px;white-space:nowrap}
table.t td{padding:10px;border-top:1px solid var(--line);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:#F7F9FC}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.tag.ok{background:var(--ok-3);color:var(--ok)}.tag.bad{background:var(--bad-3);color:var(--bad)}
.tag.off{background:#EEF0F4;color:var(--muted)}
.nota{font-size:13px;color:var(--muted);margin:10px 2px}

/* ── Painel ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(18,43,84,.08)}
.kpi .v{font-family:var(--disp);font-weight:700;font-size:36px;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.dest{background:var(--navy)}.kpi.dest .v{color:#fff}.kpi.dest .l{color:#B8C6DC}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.bloco{background:var(--card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(18,43,84,.08);min-width:0}
.bloco h3{font-family:var(--disp);font-weight:700;font-size:20px;margin:0 0 12px;color:var(--navy)}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{display:block;background:var(--navy-3);border-radius:4px;height:14px;overflow:hidden}
.bar .fl{display:block;height:100%;background:var(--navy);border-radius:4px}
.bar.lar .fl{background:var(--orange)}
.bar .vl{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}

/* ── Cadastros ── */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.add{display:flex;gap:10px;margin-bottom:12px}
.add .in{flex:1}
.cad{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(18,43,84,.08);overflow:hidden}
.cad-l{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.cad-l:first-child{border-top:0}
.cad-l .nm{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cad-l.inativo .nm{color:var(--muted);text-decoration:line-through}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer}
.mini:hover{border-color:var(--navy)}

/* ── Modal ── */
.fundo{position:fixed;inset:0;background:rgba(18,43,84,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:sobe .18s ease-out}
@keyframes sobe{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-cab{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:14px 18px;display:flex;align-items:center;gap:10px}
.modal-cab h3{margin:0;font-family:var(--disp);font-weight:700;font-size:22px;flex:1}
.modal-cab button{background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer;padding:2px 6px}
.modal-corpo{padding:18px}
.modal-rod{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-rod .esq{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label.f{color:var(--ink);font-weight:600}
.form label.f em{font-style:normal;color:var(--orange)}
.dica{font-weight:400;color:var(--muted);font-size:12px}
.resumo-op{background:var(--orange-3);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.resumo-op .cli{font-family:var(--disp);font-weight:700;font-size:22px;color:var(--navy)}
.resumo-op .meta{font-size:13px;color:var(--muted)}
.sn{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sn label{flex:1;text-align:center;padding:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.sn input{position:absolute;opacity:0;pointer-events:none}
.sn label:has(input:checked){background:var(--navy);color:#fff}
.sn label.sim:has(input:checked){background:var(--bad);color:#fff}
.sn label:has(input:focus-visible){outline:3px solid var(--orange);outline-offset:-3px}
.tempo{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.erro{background:var(--bad-3);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}

/* ── Login ── */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy)}
.login-box{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-box .marca b{font-size:40px;color:var(--navy)}
.login-box .marca span{color:var(--muted);font-size:22px}
.login-box form{display:grid;gap:14px;margin-top:22px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:80;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.toast.bad{background:var(--bad)}
.carregando{display:grid;place-items:center;padding:60px;color:var(--muted)}

@media (max-width:760px){
  .grade2{grid-template-columns:1fr}
  .form{gap:12px}
  .form .wm{grid-column:1/-1}
  .sync{display:none}
  .marca span{font-size:16px}
  .lh{grid-template-columns:1fr auto;gap:2px 10px}
  .lh .h{grid-column:1}.lh .t{grid-row:1/3;grid-column:2}
  .relogio{font-size:48px}
  .btn-g{flex:1}
  /* tabela vira cartões */
  table.t thead{display:none}
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t tr{border-top:1px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  table.t td{border:0;padding:1px 0;white-space:normal;text-align:left!important;font-size:13px}
  table.t td::before{content:attr(data-l) ": ";color:var(--muted)}
  table.t td.cli{grid-column:1/-1;font-weight:700;font-size:15px;order:-1}
  table.t td.cli::before{content:none}
}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
/* ── Firebase / sincronização ── */
.chip{border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;white-space:nowrap}
.chip.ok{background:#1E8A5A;border-color:#1E8A5A}
.chip.warn{background:var(--orange);border-color:var(--orange)}
.chip.err{background:var(--bad);border-color:var(--bad)}
.chip.run{background:#2F5FA7;border-color:#2F5FA7}
.st{border-radius:8px;padding:10px 12px;font-size:14px;margin:4px 0 10px;line-height:1.4}
.st:empty{display:none}
.st.ok{background:var(--ok-3);color:var(--ok)}
.st.warn{background:var(--orange-3);color:var(--orange-2)}
.st.err{background:var(--bad-3);color:var(--bad)}
.st.run{background:var(--navy-3);color:var(--navy)}
.db{border-top:4px solid var(--navy)}
.meta-db{font-size:14px;color:var(--muted);margin:6px 0 14px}
.meta-db b{color:var(--ink)}
.db-bts{display:flex;flex-wrap:wrap;gap:8px}
.opcoes{display:grid;gap:10px}
.opcoes .btn{justify-content:flex-start;padding:14px 16px}
.radios{display:grid;gap:8px;margin-top:6px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;font-weight:400;font-size:14px;color:var(--ink)}
.radio input{margin-top:3px}
.radio:has(input:checked){border-color:var(--navy);background:var(--navy-3)}
.senha{-webkit-text-security:disc;text-security:disc;font-family:var(--body)}
#progresso{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:640px;margin:0 auto}
#progresso .pg-t{font-size:14px;font-weight:600;margin-bottom:8px}
#progresso .pg-b{height:8px;background:rgba(255,255,255,.2);border-radius:5px;overflow:hidden}
#progresso .pg-b span{display:block;height:100%;background:var(--orange);border-radius:5px;transition:width .2s}
#progresso.ind .pg-b span{width:35%!important;animation:vai 1.1s ease-in-out infinite alternate}
@keyframes vai{from{transform:translateX(-10%)}to{transform:translateX(200%)}}
.rodape{text-align:center;font-size:12px;color:var(--muted);padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ver{text-align:center;color:var(--muted);font-size:12px;margin:16px 0 0}
.login-box .st{margin-top:4px}
@media (max-width:760px){ .chip{font-size:12px;padding:5px 10px} .db-bts .btn{flex:1 1 45%} }
</style>
</head>

const p2 = n => String(n).padStart(2,'0');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => (Number(n)||0).toLocaleString('pt-BR');
const up = s => String(s==null?'':s).trim().toUpperCase();
const isoDe = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hojeISO = () => isoDe(new Date());
const agoraHora = () => { const d=new Date(); return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); };
const mesAtual = () => hojeISO().slice(0,7);
const mesAnterior = () => { const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return isoDe(d).slice(0,7); };
const dataBR = iso => iso ? String(iso).slice(0,10).split('-').reverse().join('/') : '';
const fmtDataHora = ms => { if(!ms) return ''; const d=new Date(+ms); return dataBR(isoDe(d))+' '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); };
const isoParaMs = iso => iso ? new Date(String(iso).slice(0,10)+'T00:00:00').getTime() : '';
const msParaIso = ms => (ms===''||ms==null||isNaN(+ms)) ? '' : isoDe(new Date(+ms));
const seg = h => { const m=String(h||'').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/); return m ? (+m[1])*3600+(+m[2])*60+(+(m[3]||0)) : null; };
const dur = (hi,hf) => { const a=seg(hi), b=seg(hf); if(a==null||b==null) return null; let d=b-a; if(d<0) d+=86400; return d; };
const fmtDur = s => { if(s==null||isNaN(s)) return '--:--:--'; s=Math.max(0,Math.round(s)); return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60); };
const fmtDurCurto = s => { if(s==null||isNaN(s)) return '-'; s=Math.round(s); const h=Math.floor(s/3600), m=Math.round(s%3600/60); return h ? h+'h'+p2(m) : m+' min'; };
const fmtEspera = s => { if(s==null||isNaN(s)) return '-'; s=Math.max(0,Math.round(s)); const d=Math.floor(s/86400); return (d? d+'d ':'')+p2(Math.floor(s%86400/3600))+':'+p2(Math.floor(s%3600/60))+(d?'':':'+p2(s%60)); };
const ehEntrada = m => /ENTRADA|RECEB/i.test(m||'');
const ehSeparacao = m => /SEPARA/i.test(m||'');
const espera = ms => new Promise(r => setTimeout(r, ms));

/* chave segura para o Firebase: sem . # $ [ ] / */

/* nunca grava undefined: vira null */
function limpa(v){
  if(v === undefined) return null;
  if(v === null || typeof v !== 'object') return (typeof v === 'number' && !isFinite(v)) ? 0 : v;
  if(Array.isArray(v)) return v.map(limpa);
  const o = {}; Object.keys(v).forEach(k => { o[k] = limpa(v[k]); }); return o;
}
async function sha256(t){
  if(!(window.crypto && crypto.subtle)) throw new Error('Este navegador não consegue conferir a senha (abra pelo endereço https).');
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2,'0')).join('');
}
async function senhaOk(t){ return (await sha256(String(t||''))) === SENHA_HASH; }

/* ═══════════ FILA DE GRAVAÇÃO OFFLINE ═══════════
   op = {t:'set'|'upd'|'del', p:'caminho/relativo/à/raiz', v:valor}  — tudo idempotente */
const lerFila = () => store.get(K.fila, []);
function enqueue(...ops){
  const f = lerFila(); let seq = store.get(K.seq, 0);
  ops.forEach(o => { o.s = ++seq; o.v = limpa(o.v); f.push(o); anotarDiario(o); });
  store.set(K.seq, seq); store.set(K.fila, f);
  updateSyncUI(); flush();
}
function removerDaFila(ids){ const set = new Set(ids); store.set(K.fila, lerFila().filter(o => !set.has(o.s))); }
function opPaths(op){
  if(op.t === 'del') return { [op.p]: null };
  if(op.t === 'upd'){ const o = {}; Object.keys(op.v || {}).forEach(k => { o[op.p + '/' + k] = op.v[k]; }); return o; }
  return { [op.p]: op.v };
}
/* dois caminhos "pai e filho" não podem ir no mesmo update */
function conflita(mapa, p){
  return Object.keys(mapa).some(k => k !== p && (k.startsWith(p + '/') || p.startsWith(k + '/')));
}
function agrupar(ops){
  const grupos = []; let mapa = {}, ids = [];
  ops.forEach(op => {
    const ps = opPaths(op);
    if(Object.keys(ps).some(p => conflita(mapa, p))){ grupos.push({ mapa, ids }); mapa = {}; ids = []; }
    Object.assign(mapa, ps); ids.push(op.s);
  });
  if(ids.length) grupos.push({ mapa, ids });
  return grupos;
}
function traduzErro(e){
  const c = (e && (e.code || e.message)) || String(e);
  if(/PERMISSION_DENIED|permission/i.test(c)) return 'sem permissão para gravar (confira as regras do banco e o login Anônimo)';
  return c;
}
async function flush(){
  if(!root || !authOk || gravando){ updateSyncUI(); return; }
  const pend = lerFila().filter(o => !emVoo.has(o.s));
  if(!pend.length){ updateSyncUI(); return; }
  gravando = true; updateSyncUI();
  try{
    for(let i = 0; i < pend.length; i += 400){
      for(const g of agrupar(pend.slice(i, i + 400))){
        g.ids.forEach(s => emVoo.add(s));
        const pr = root.update(g.mapa).then(
          () => { removerDaFila(g.ids); g.ids.forEach(s => emVoo.delete(s)); ultimoErro = ''; updateSyncUI(); return true; },
          e  => { g.ids.forEach(s => emVoo.delete(s)); ultimoErro = traduzErro(e); updateSyncUI(); return false; });
        if(conectado){
          const r = await Promise.race([pr, espera(20000).then(() => 'tempo')]);
          if(r !== true) return;   // erro ou sem resposta: o resto fica na fila
        }
        /* offline: entrega ao SDK (aparece na tela na hora) e confirma quando a conexão voltar */
      }
    }
  } finally { gravando = false; updateSyncUI(); }
}
setInterval(flush, 15000);

/* diário local: o que este aparelho gravou (para "Reenviar dados deste aparelho") */
function anotarDiario(op){
  if(!/^(mov|cad|usuarios|ocupacao)\//.test(op.p)) return;
  let d = store.get(K.diario, []);
  if(op.t === 'del'){ d = d.filter(x => x.p !== op.p); }
  else if(op.t === 'upd'){ const x = d.find(y => y.p === op.p); if(x && x.v) Object.assign(x.v, op.v); }
  else { d = d.filter(x => x.p !== op.p); d.push({ p:op.p, v:op.v, ms:Date.now() }); }
  if(d.length > 3000) d = d.slice(-3000);
  store.set(K.diario, d);
}

function estadoSync(){
  const n = lerFila().length;
  if(fbErro) return { c:'err', s:'Erro', t:fbErro };
  if(!root || !authOk) return { c:'warn', s:'Conectando', t:'Conectando ao banco de dados…' };
  if(ultimoErro) return { c:'err', s:'Erro' + (n ? ' | Fila ' + n : ''), t:(n ? n + ' gravação(ões) na fila. ' : '') + 'Erro: ' + ultimoErro };
  if(!conectado) return { c:'warn', s:'Offline' + (n ? ' | Fila ' + n : ''), t:'Sem conexão com o banco. ' + (n ? n + ' gravação(ões) guardada(s) neste aparelho; serão enviadas sozinhas quando a conexão voltar.' : 'O que for lançado agora fica guardado neste aparelho até a conexão voltar.') };
  if(gravando || emVoo.size) return { c:'run', s:'Gravando', t:'Enviando ' + Math.max(n,1) + ' gravação(ões) para o banco…' };
  if(n) return { c:'warn', s:'Fila ' + n, t:n + ' gravação(ões) aguardando envio.' };
  return { c:'ok', s:'Online ✓', t:'Conectado. Tudo o que foi feito neste aparelho está no banco.' };
}

/* ═══════════ LOGIN / SESSÃO ═══════════ */
function esperarUsuarios(ms){
  return new Promise((ok, falha) => {
    const t0 = Date.now();
    (function v(){ if(D.usuOk) return ok(); if(fbErro) return falha(new Error(fbErro));
      if(Date.now() - t0 > ms) return falha(new Error('Sem conexão com o banco para conferir o usuário. Verifique a internet e tente de novo.'));
      setTimeout(v, 200); })();
  });
}
async function autenticar(login, senha){
  login = chave(up(login));
  await esperarUsuarios(15000);
  if(!Object.keys(D.usuarios).length){
    if(login === ADMIN_INICIAL.login && senha === ADMIN_INICIAL.senha){
      enqueue({ t:'set', p:'usuarios/ADMIN', v:{ nome:'Administrador', senha, perfil:'ADMIN', ativo:true } });
      return { usuario:'ADMIN', nome:'Administrador', perfil:'ADMIN' };
    }
    throw new Error('Ainda não há usuários no banco. Entre com ADMIN / ' + ADMIN_INICIAL.senha + ' e importe os dados da planilha antiga.');
  }
  const u = D.usuarios[login];
  if(!u || String(u.senha) !== String(senha) || u.ativo === false) throw new Error('Usuário ou senha inválidos.');
  return { usuario:login, nome:u.nome || login, perfil:u.perfil === 'ADMIN' ? 'ADMIN' : 'OPERADOR' };
}
function validarSessao(){
  if(!S.user || !D.usuOk || !Object.keys(D.usuarios).length) return;
  const u = D.usuarios[S.user.usuario];
  if(!u || u.ativo === false){ sair('Seu usuário foi desativado ou removido.'); return; }
  const novo = { usuario:S.user.usuario, nome:u.nome || S.user.usuario, perfil:u.perfil === 'ADMIN' ? 'ADMIN' : 'OPERADOR' };
  if(novo.nome !== S.user.nome || novo.perfil !== S.user.perfil){ S.user = novo; if(store.get(K.sess, null)) store.set(K.sess, novo); }
}

/* ══════════ OPERAÇÃO ══════════ */
function fimSeparacao(r){ const d = new Date(r.data + 'T' + (r.hf || '00:00:00')); if(seg(r.hf) != null && seg(r.hf) < seg(r.hi)) d.setDate(d.getDate() + 1); return d; }
function tempoRetirada(r){ if(r.stEnt !== ST_EN || !r.entData) return null; return (new Date(r.entData + 'T' + (r.entHora || '00:00:00')) - fimSeparacao(r)) / 1000; }
const isoLocal = d => isoDe(d) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
const tagEnt = r => r.stEnt === ST_AG ? '<span class="tag ag">Aguardando retirada</span>' : r.stEnt === ST_EN ? '<span class="tag ok">Entregue</span>' : '';

function enviarAgora(){ ultimoErro = ''; emVoo.clear(); flush(); toast(lerFila().length ? 'Enviando a fila…' : 'Nada pendente neste aparelho.'); }
function cancelarAnd(id){

/* ══════════ LANÇAMENTOS ══════════ */
function mesesDoPeriodo(de, ate){
  const todos = Array.from(new Set(D.meses.concat([mesAtual(), mesAnterior()]))).sort();
  return todos.filter(m => (!de || m >= de.slice(0,7)) && (!ate || m <= ate.slice(0,7)));
}
function filtrados(){
  const f = S.f, q = f.q.trim().toUpperCase();
  return registros().filter(r =>
    (!f.de || r.data >= f.de) && (!f.ate || r.data <= f.ate) &&
    (!f.cliente || r.cliente === f.cliente) && (!f.mov || r.mov === f.mov) && (!f.colab || r.colab === f.colab) &&
    (!f.ent || r.stEnt === f.ent) &&
    (!q || (r.nf + ' ' + r.obs + ' ' + r.cliente + ' ' + r.entPor + ' ' + r.entObs).toUpperCase().includes(q))
  ).sort((a,b) => (b.data + b.hi).localeCompare(a.data + a.hi));
}
const unicos = (campo, tipo) => Array.from(new Set(registros().map(r => r[campo]).filter(Boolean).concat(tipo ? ativos(tipo) : []))).sort();
const optList = (lista, sel, vazio) => `<option value="">${vazio}</option>` + lista.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

function vLancamentos(){
  const meses = mesesDoPeriodo(S.f.de, S.f.ate);
  garantirMeses(meses);
  const faltam = meses.filter(m => !D.carregado[m]).length;
  const L = filtrados(), f = S.f;
  const soma = k => L.reduce((s, r) => s + (r[k] || 0), 0);
  const div = L.filter(r => r.div === 'SIM').length;
  const LIM = 400;
  return `
  <div class="filtros">
    <label class="f">De<input class="in" type="date" name="px-de" value="${f.de}" onchange="S.f.de=this.value;render()"></label>

    <label class="f">Movimento<select class="in" onchange="S.f.mov=this.value;render()">${optList(unicos('mov','movimentos'), f.mov, 'Todos')}</select></label>
    <label class="f">Colaborador<select class="in" onchange="S.f.colab=this.value;render()">${optList(unicos('colab','colaboradores'), f.colab, 'Todos')}</select></label>
    <label class="f">Entrega<select class="in" onchange="S.f.ent=this.value;render()">
      <option value="">Todos</option><option value="${ST_AG}" ${f.ent === ST_AG ? 'selected' : ''}>Aguardando retirada</option><option value="${ST_EN}" ${f.ent === ST_EN ? 'selected' : ''}>Entregue</option></select></label>
    <label class="f">Buscar<input class="in" type="search" name="px-busca-lanc" ${CAMPO} value="${esc(f.q)}" placeholder="Ex.: PED 0387"></label>
  </div>
  ${faltam ? `<p class="nota">Carregando ${faltam} mês(es) do banco…</p>` : ''}
  <div class="resumo">
    <span><b>${nf(L.length)}</b>lançamentos</span>
    <span><b>${nf(soma('vol'))}</b>volumes</span>
    <span><b>${nf(soma('un'))}</b>unidades</span>
    <span><b>${nf(soma('pal'))}</b>pallets (saldo)</span>
    <span><b>${nf(div)}</b>com divergência</span>
  </div>
  <div class="barra" style="margin:0 0 12px">
    <button class="btn-sec btn" onclick="limparFiltros()">Limpar filtros</button>
    <div style="display:flex;gap:10px">
      <button class="btn btn-sec" onclick="exportarCSV()">Exportar para Excel</button>
      <button class="btn btn-pri" onclick="abrirForm('novo')">Novo lançamento</button>
    </div>
  </div>
  ${L.length ? `<div class="tab-wrap"><table class="t">
    <thead><tr><th>Data</th><th>Início</th><th>Fim</th><th class="n">Tempo</th><th>Cliente</th><th>Movimento</th><th>Colaborador</th><th>NF / DI / PED</th><th class="n">SKU</th><th class="n">Vol.</th><th class="n">Unid.</th><th class="n">Pallets</th><th>Diverg.</th><th>Entrega</th></tr></thead>
    <tbody>${L.slice(0, LIM).map(r => `<tr onclick="abrirRegistro('${esc(r.id)}','${esc(r.data.slice(0,7))}')">
      <td data-l="Data">${dataBR(r.data)}</td><td data-l="Início">${esc(r.hi.slice(0,5))}</td><td data-l="Fim">${esc(r.hf.slice(0,5))}</td>
      <td class="n" data-l="Tempo">${fmtDur(dur(r.hi, r.hf)).slice(0,5)}</td>
      <td class="cli" data-l="Cliente">${esc(r.cliente)}</td><td data-l="Movimento">${esc(r.mov)}</td><td data-l="Colaborador">${esc(r.colab)}</td><td data-l="NF/DI/PED">${esc(r.nf)}</td>
      <td class="n" data-l="SKU">${nf(r.sku)}</td><td class="n" data-l="Volumes">${nf(r.vol)}</td><td class="n" data-l="Unidades">${nf(r.un)}</td><td class="n" data-l="Pallets">${nf(r.pal)}</td>
      <td data-l="Divergência"><span class="tag ${r.div === 'SIM' ? 'bad' : 'ok'}">${r.div === 'SIM' ? 'Sim' : 'Não'}</span></td>
      <td data-l="Entrega">${r.stEnt === ST_EN ? `<span class="tag ok">${dataBR(r.entData).slice(0,5)} ${esc(r.entHora.slice(0,5))}</span>` : r.stEnt === ST_AG ? '<span class="tag ag">Aguardando</span>' : '-'}</td>
    </tr>`).join('')}</tbody></table></div>
    ${L.length > LIM ? `<p class="nota">Mostrando os ${LIM} mais recentes de ${nf(L.length)}. Use os filtros para refinar; a exportação inclui todos.</p>` : ''}`
  : `<div class="vazio">${faltam ? 'Carregando…' : 'Nenhum lançamento para esses filtros.'}</div>`}`;
}
function limparFiltros(){ S.f = { de:'', ate:'', cliente:'', mov:'', colab:'', ent:'', q:'' }; render(); }
function exportarCSV(){
  const L = filtrados();
  const cab = ['DATA','HORA INICIAL','HORA FINAL','TEMPO','CLIENTE','MOVIMENTO','COLABORADOR','NF/ DI/ PED','QTD DE SKU','QTD DE VOLUMES','QTD DE UNIDADES','QTD DE PALLETS','DIVERGENCIA','OBSERVAÇÕES','LANÇADO POR','STATUS ENTREGA','ENTREGUE POR','DATA ENTREGA','HORA ENTREGA','OBS ENTREGA'];
  const q = v => { const s = String(v == null ? '' : v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const linhas = L.map(r => [dataBR(r.data), r.hi, r.hf, fmtDur(dur(r.hi, r.hf)), r.cliente, r.mov, r.colab, r.nf, r.sku, r.vol, r.un, r.pal, r.div, r.obs, r.email, r.stEnt, r.entPor, dataBR(r.entData), r.entHora, r.entObs].map(q).join(';'));
  baixar(new Blob(['\ufeff' + [cab.join(';')].concat(linhas).join('\r\n')], { type:'text/csv;charset=utf-8' }), `movimentacao_estoque_${S.f.de || 'inicio'}_a_${S.f.ate || 'hoje'}.csv`);
}
function baixar(blob, nome){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ══════════ PAINEL ══════════ */
function vPainel(){
  const p = S.p;
  garantirMeses([p.mes]); garantirOcup(p.mes);
  const R = regsDoMes(p.mes).filter(r => !p.cliente || r.cliente === p.cliente);
  const ent = R.filter(r => ehEntrada(r.mov)), sep = R.filter(r => ehSeparacao(r.mov));
  const media = L => { const t = L.map(r => dur(r.hi, r.hf)).filter(x => x != null); return t.length ? t.reduce((a,b) => a + b, 0) / t.length : null; };
  const div = R.filter(r => r.div === 'SIM').length;
  const efic = R.length ? (1 - div / R.length) * 100 : null;
  const palE = R.reduce((s,r) => s + (r.pal > 0 ? r.pal : 0), 0), palS = R.reduce((s,r) => s + (r.pal < 0 ? -r.pal : 0), 0);
  const agrupa = campo => {
    const m = {}; R.forEach(r => { const k = r[campo] || '(sem)'; m[k] = m[k] || { n:0, t:0 }; m[k].n++; m[k].t += dur(r.hi, r.hf) || 0; });
    return Object.entries(m).map(([k, v]) => ({ k, n:v.n, t:v.t })).sort((a,b) => b.n - a.n);
  };
  const barras = (lista, val, txt, cls = '') => { const max = Math.max(1, ...lista.map(val)); return lista.map(x => `
    <div class="bar ${cls}"><span class="nm" title="${esc(x.k)}">${esc(x.k)}</span><span class="tr"><span class="fl" style="width:${(val(x)/max*100).toFixed(1)}%"></span></span><span class="vl">${txt(x)}</span></div>`).join(''); };
  const porCli = agrupa('cliente'), porCol = agrupa('colab'), porMov = agrupa('mov');
  const O = D.ocupacao[p.mes];
  const LO = O ? Object.values(O).map(x => ({ k:x.cliente, v:+x.pallets || 0 })).filter(x => !p.cliente || x.k === p.cliente).sort((a,b) => b.v - a.v) : [];
  const totO = LO.reduce((s,x) => s + x.v, 0);
  const ocu = `<div class="bloco"><h3>Pallets em estoque no mês (${nf(totO)})</h3>${LO.length ? barras(LO, x => x.v, x => nf(x.v), 'lar') : `<p class="nota">Ocupação deste mês ainda não lançada.${isAdmin() ? ' Lance em Cadastros, Ocupação.' : ''}</p>`}</div>`;
  const meses = Array.from(new Set(D.meses.concat([mesAtual(), p.mes]))).sort().reverse();
  const nomeMes = m => { const [a,b] = m.split('-'); return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][+b-1] + ' ' + a; };
  const tRet = sep.map(tempoRetirada).filter(x => x != null && x >= 0);
  return `
  <div class="filtros" style="grid-template-columns:repeat(auto-fit,minmax(200px,260px))">
    <label class="f">Mês<select class="in" onchange="S.p.mes=this.value;render()">${meses.map(m => `<option value="${m}" ${m === p.mes ? 'selected' : ''}>${nomeMes(m)}</option>`).join('')}</select></label>
    <label class="f">Cliente<select class="in" onchange="S.p.cliente=this.value;render()">${optList(unicos('cliente','clientes'), p.cliente, 'Todos')}</select></label>
  </div>
  ${D.carregado[p.mes] ? '' : '<p class="nota">Carregando o mês do banco…</p>'}
  <div class="kpis">
    <div class="kpi dest"><div class="v">${nf(R.length)}</div><div class="l">Operações no mês</div></div>
    <div class="kpi"><div class="v">${fmtDur(media(ent))}</div><div class="l">Tempo médio de recebimento (${ent.length})</div></div>
    <div class="kpi"><div class="v">${fmtDur(media(sep))}</div><div class="l">Tempo médio de separação (${sep.length})</div></div>
    <div class="kpi"><div class="v">${efic == null ? '-' : efic.toFixed(1).replace('.', ',') + '%'}</div><div class="l">Eficiência (${div} com divergência)</div></div>
    <div class="kpi"><div class="v">${nf(R.reduce((s,r) => s + r.vol, 0))}</div><div class="l">Volumes movimentados</div></div>
    <div class="kpi"><div class="v">${nf(R.reduce((s,r) => s + r.un, 0))}</div><div class="l">Unidades movimentadas</div></div>
    <div class="kpi"><div class="v">${nf(palE)} / ${nf(palS)}</div><div class="l">Pallets entrada / saída</div></div>
    <div class="kpi"><div class="v">${nf(aguardando().filter(r => !p.cliente || r.cliente === p.cliente).length)}</div><div class="l">Aguardando retirada agora</div></div>
    <div class="kpi"><div class="v">${tRet.length ? fmtEspera(tRet.reduce((a,b) => a + b, 0) / tRet.length).replace(/:\d\d$/, '') : '-'}</div><div class="l">Tempo médio da separação à retirada</div></div>
  </div>
  ${R.length ? `
  <div class="grade2">
    <div class="bloco"><h3>Operações por cliente</h3>${barras(porCli, x => x.n, x => nf(x.n))}</div>
    <div class="bloco"><h3>Operações por colaborador</h3>${barras(porCol, x => x.n, x => nf(x.n) + ' | ' + fmtDurCurto(x.t))}</div>
    <div class="bloco"><h3>Por tipo de movimento</h3>
      <div class="tab-wrap" style="box-shadow:none"><table class="t"><thead><tr><th>Movimento</th><th class="n">Total</th><th class="n">Tempo total</th><th class="n">Média</th></tr></thead>
      <tbody>${porMov.map(x => `<tr style="cursor:default"><td class="cli" data-l="Movimento">${esc(x.k)}</td><td class="n" data-l="Total">${nf(x.n)}</td><td class="n" data-l="Tempo total">${fmtDur(x.t)}</td><td class="n" data-l="Média">${fmtDur(x.t / x.n)}</td></tr>`).join('')}</tbody></table></div>
    </div>
    ${ocu}
  </div>` : `<div class="vazio" style="margin-top:14px">Sem lançamentos neste mês.</div><div class="grade2">${ocu}</div>`}`;
}

/* ══════════ CADASTROS ══════════ */
const CAD_NOMES = { clientes:'Clientes', colaboradores:'Colaboradores', movimentos:'Movimentos', observacoes:'Observações', ocupacao:'Ocupação', usuarios:'Usuários' };
function vCadastros(){
  if(!isAdmin()) return '<div class="vazio">Acesso restrito a administradores.</div>';
  const seg = `<div class="seg">${Object.entries(CAD_NOMES).map(([k, v]) => `<button aria-pressed="${S.cad === k}" onclick="S.cad='${k}';render()">${v}</button>`).join('')}</div>`;
  if(S.cad === 'usuarios') return seg + vUsuarios();
  if(S.cad === 'ocupacao') return seg + vOcupacao();
  const lista = cadLista(S.cad).sort((a,b) => (b.ativo - a.ativo) || a.nome.localeCompare(b.nome));
  return seg + `
  <form class="add" ${CAMPO} onsubmit="event.preventDefault();cadAdd(this)">
    <input class="in" name="px-cad-nome" ${CAMPO} placeholder="Novo item em ${CAD_NOMES[S.cad].toLowerCase()}" required ${S.cad !== 'observacoes' ? 'style="text-transform:uppercase"' : ''}>
    <button class="btn btn-pri" type="submit">Adicionar</button>
  </form>
  <p class="nota">Itens inativos deixam de aparecer nos formulários, mas continuam nos lançamentos antigos.</p>
  <div class="cad">${lista.length ? lista.map(x => `
    <div class="cad-l ${x.ativo ? '' : 'inativo'}">
      <span class="nm">${esc(x.nome)}</span>
      <span class="tag ${x.ativo ? 'ok' : 'off'}">${x.ativo ? 'Ativo' : 'Inativo'}</span>
      <button class="mini" data-k="${esc(x.key)}" onclick="cadRenomear(this.dataset.k)">Renomear</button>
      <button class="mini" data-k="${esc(x.key)}" onclick="cadAlternar(this.dataset.k)">${x.ativo ? 'Desativar' : 'Ativar'}</button>
    </div>`).join('') : `<div class="cad-l"><span class="nm">${D.cadOk ? 'Nenhum item cadastrado.' : 'Carregando…'}</span></div>`}</div>`;
}
const normNome = (tipo, n) => tipo === 'observacoes' ? String(n || '').trim() : up(n);
function cadGravar(tipo, key, nome, ativo){
  nome = normNome(tipo, nome);
  if(!nome) throw new Error('Informe o nome.');
  const dup = cadLista(tipo).find(x => normNome(tipo, x.nome) === nome && x.key !== key);
  if(dup) throw new Error('"' + nome + '" já está cadastrado.');
  enqueue({ t:'set', p:'cad/' + tipo + '/' + (key || chave(nome)), v:{ nome, ativo } });
}
function cadAdd(form){
  const nome = form['px-cad-nome'].value;
  try{ cadGravar(S.cad, null, nome, true); toast(`"${normNome(S.cad, nome)}" adicionado.`); form.reset(); }catch(e){ toast(e.message, true); }
}
function cadRenomear(key){
  const x = cadLista(S.cad).find(i => i.key === key); if(!x) return;
  const novo = prompt('Novo nome para "' + x.nome + '":', x.nome); if(!novo || novo.trim() === x.nome) return;
  if(!confirm('Renomear altera só o cadastro. Os lançamentos antigos continuam com "' + x.nome + '". Continuar?')) return;
  try{ cadGravar(S.cad, key, novo, x.ativo); toast('Nome atualizado.'); }catch(e){ toast(e.message, true); }
}
function cadAlternar(key){
  const x = cadLista(S.cad).find(i => i.key === key); if(!x) return;
  try{ cadGravar(S.cad, key, x.nome, !x.ativo); toast(x.ativo ? 'Item desativado.' : 'Item ativado.'); }catch(e){ toast(e.message, true); }
}

function vOcupacao(){
  garantirOcup(S.ocMes);
  const O = D.ocupacao[S.ocMes] || {};
  const porCli = {}; Object.values(O).forEach(x => { porCli[x.cliente] = x.pallets; });
  const clientes = Array.from(new Set(ativos('clientes').concat(Object.keys(porCli)))).sort();
  return `
  <div class="barra" style="margin:0 0 12px">
    <label class="f" style="max-width:220px">Mês<input class="in" type="month" name="px-oc-mes" value="${S.ocMes}" onchange="S.ocMes=this.value||mesAtual();render()"></label>
    <button class="btn btn-pri" onclick="salvarOcupacao()">Salvar ocupação</button>
  </div>
  <p class="nota">Pallets em estoque por cliente no mês (aparece no Painel). Deixe em branco o cliente sem estoque.</p>
  <form id="fOcup" class="cad" ${CAMPO} onsubmit="return false">${clientes.map((c, i) => `
    <div class="cad-l"><span class="nm">${esc(c)}</span>
      <input class="in" style="max-width:120px" type="number" inputmode="numeric" min="0" step="1" name="px-oc-${i}" data-cli="${esc(c)}" value="${porCli[c] == null ? '' : porCli[c]}"></div>`).join('')}
  </form>`;
}
function salvarOcupacao(){
  const ops = [];
  document.querySelectorAll('#fOcup input[data-cli]').forEach(el => {
    const c = el.dataset.cli, k = chave(c), v = el.value.trim();
    ops.push(v === '' ? { t:'del', p:'ocupacao/' + S.ocMes + '/' + k } : { t:'set', p:'ocupacao/' + S.ocMes + '/' + k, v:{ cliente:c, pallets:Number(v) || 0 } });
  });
  if(ops.length){ enqueue(...ops); toast('Ocupação salva.'); }
}

function vUsuarios(){
  const lista = Object.entries(D.usuarios).map(([login, u]) => ({ usuario:login, nome:u.nome || login, perfil:u.perfil === 'ADMIN' ? 'ADMIN' : 'OPERADOR', ativo:u.ativo !== false })).sort((a,b) => a.usuario.localeCompare(b.usuario));
  return `
  <div class="barra" style="margin:0 0 12px"><span class="nota" style="margin:0">Operadores lançam e finalizam operações. Administradores também editam, excluem e mantêm os cadastros.</span>
  <button class="btn btn-pri" onclick="abrirUsuario()">Novo usuário</button></div>
  <div class="cad">${lista.map(u => `
    <div class="cad-l ${u.ativo ? '' : 'inativo'}">
      <span class="nm"><b>${esc(u.usuario)}</b> <span class="dica">${esc(u.nome)}</span></span>
      <span class="tag ${u.perfil === 'ADMIN' ? 'bad' : 'off'}">${u.perfil === 'ADMIN' ? 'Administrador' : 'Operador'}</span>
      <span class="tag ${u.ativo ? 'ok' : 'off'}">${u.ativo ? 'Ativo' : 'Inativo'}</span>
      <button class="mini" data-k="${esc(u.usuario)}" onclick="abrirUsuario(this.dataset.k)">Editar</button>
    </div>`).join('')}</div>`;
}
function abrirUsuario(login){
  const ex = login ? D.usuarios[login] : null;
  const u = ex ? { usuario:login, nome:ex.nome || login, perfil:ex.perfil, ativo:ex.ativo !== false } : { usuario:'', nome:'', perfil:'OPERADOR', ativo:true };
  abrirModal(login ? 'Editar usuário' : 'Novo usuário', `
    <form id="fUsu" class="form" ${CAMPO} onsubmit="return false">
      <label class="f"><span>Usuário (login)<em>*</em></span><input class="in" name="px-u-login" ${CAMPO} value="${esc(u.usuario)}" ${login ? 'disabled' : ''} required style="text-transform:uppercase"></label>
      <label class="f">Nome<input class="in" name="px-u-nome" ${CAMPO} value="${esc(u.nome)}"></label>
      <label class="f"><span>Senha ${login ? '<span class="dica">(em branco mantém a atual)</span>' : '<em>*</em>'}</span><input class="in senha" type="text" name="px-u-pin" ${CAMPO} ${login ? '' : 'required'}></label>
      <label class="f">Perfil<select class="in" name="px-u-perfil"><option value="OPERADOR" ${u.perfil !== 'ADMIN' ? 'selected' : ''}>Operador</option><option value="ADMIN" ${u.perfil === 'ADMIN' ? 'selected' : ''}>Administrador</option></select></label>
      <label class="chk full"><input type="checkbox" name="px-u-ativo" ${u.ativo ? 'checked' : ''}> Usuário ativo (pode entrar no app)</label>
    </form><div id="fErro"></div>`,
    `<button class="btn btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn btn-pri" id="bOk">Salvar usuário</button>`);
  $('#bOk').onclick = () => {
    const f = $('#fUsu'); if(!f.reportValidity()) return;
    const lg = chave(up(login || f['px-u-login'].value));
    const at = D.usuarios[lg];
    if(!login && at) return erroForm('Já existe o usuário ' + lg + '.');
    const senha = f['px-u-pin'].value;
    if(!at && !senha) return erroForm('Informe a senha do novo usuário.');
    enqueue({ t:'set', p:'usuarios/' + lg, v:{ nome:f['px-u-nome'].value.trim() || lg, senha: senha || at.senha, perfil:f['px-u-perfil'].value, ativo:f['px-u-ativo'].checked } });
    fecharModal(); toast('Usuário salvo.');
  };
}

/* ══════════ FORMULÁRIO DE OPERAÇÃO ══════════ */
const OBS_AUTO = { entrada:'Material recebido sem divergência.', separacao:'Pedido separado sem divergência.' };
const obsPadrao = mov => ehEntrada(mov) ? OBS_AUTO.entrada : ehSeparacao(mov) ? OBS_AUTO.separacao : '';
function selectCad(name, tipo, valor, dis){
  const lista = ativos(tipo);
  if(valor && !lista.includes(valor)) lista.unshift(valor);
  return `<select class="in" name="${name}" required ${dis ? 'disabled' : ''}><option value="">Selecione</option>${lista.map(v => `<option ${v === valor ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
}
function camposInicio(r, dis){
  const d = dis ? 'disabled' : '';
  return `
    <label class="f"><span>Data<em>*</em></span><input class="in" type="date" name="data" value="${esc(r.data)}" required ${d}></label>
    <label class="f"><span>Hora inicial<em>*</em></span><input class="in" type="time" step="1" name="hi" value="${esc(r.hi)}" required ${d}></label>
    <label class="f wm"><span>Cliente<em>*</em></span>${selectCad('cliente','clientes',r.cliente,dis)}</label>
    <label class="f wm"><span>Movimento<em>*</em></span>${selectCad('mov','movimentos',r.mov,dis)}</label>
    <label class="f wm"><span>Colaborador<em>*</em></span>${selectCad('colab','colaboradores',r.colab,dis)}</label>
    <label class="f wm">NF / DI / PED<input class="in" name="nf" ${CAMPO} value="${esc(r.nf)}" placeholder="Ex.: NF 12228 ou PED 0387" ${d}></label>`;
}
function camposFim(r, dis){
  const d = dis ? 'disabled' : '';
  const num = (n, l, v, extra = '') => `<label class="f"><span>${l}<em>*</em></span><input class="in" type="number" inputmode="numeric" step="1" name="${n}" value="${v == null ? 0 : v}" required ${extra} ${d}></label>`;
  return `
    ${num('sku','Qtd. de SKU',r.sku,'min="0"')}
    ${num('vol','Qtd. de volumes',r.vol,'min="0"')}
    ${num('un','Qtd. de unidades',r.un,'min="0"')}
    <label class="f"><span>Qtd. de pallets<em>*</em></span><input class="in" type="number" inputmode="numeric" step="1" name="pal" value="${r.pal == null ? 0 : r.pal}" required ${d}><span class="dica">Negativo = saída</span></label>
    <label class="f"><span>Hora final<em>*</em></span><input class="in" type="time" step="1" name="hf" value="${esc(r.hf)}" required ${d}></label>
    <div class="f" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;justify-content:flex-end">Tempo realizado<span class="tempo" id="tempoForm">--:--:--</span></div>
    <div class="f full" style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600">Divergência
      <div class="sn" role="radiogroup" aria-label="Divergência">
        <label><input type="radio" name="div" value="NÃO" ${r.div !== 'SIM' ? 'checked' : ''} ${d}>Não</label>
        <label class="sim"><input type="radio" name="div" value="SIM" ${r.div === 'SIM' ? 'checked' : ''} ${d}>Sim</label>
      </div></div>
    <label class="f full"><span>Observações <span class="dica" id="obsDica"></span></span>
      <input class="in" name="obs" list="dlObs" ${CAMPO} value="${esc(r.obs)}" ${d}>
      <datalist id="dlObs">${ativos('observacoes').map(o => `<option value="${esc(o)}">`).join('')}</datalist></label>`;
}

function abrirForm(modo, id, rec){
  const agora = agoraHora(), hoje = hojeISO();
  let r, titulo, corpo, rodape;
  if(modo === 'iniciar'){
    r = { data:hoje, hi:agora };
    titulo = 'Iniciar operação';
    corpo = `<form id="fOp" class="form" ${CAMPO} onsubmit="return false">${camposInicio(r)}</form>`;
    rodape = `<button class="btn btn-sec" onclick="fecharModal()">Voltar</button><button class="btn btn-pri" id="bOk">▶ Iniciar agora</button>`;
  } else if(modo === 'finalizar'){
    const a = D.andamento[id]; if(!a){ toast('Operação não encontrada. Talvez já tenha sido finalizada em outro aparelho.', true); return; }
    r = Object.assign({ id }, a, { hf:agora, sku:0, vol:0, un:0, pal:0, div:'NÃO', obs:obsPadrao(a.mov) });
    titulo = 'Finalizar operação';
    corpo = `<div class="resumo-op"><div class="cli">${esc(a.cliente)}</div><div class="meta">${esc(a.mov)} | ${esc(a.colab)}${a.nf ? ' | ' + esc(a.nf) : ''}<br>Início ${dataBR(a.data)} às ${esc(a.hi)}</div></div>
      <form id="fOp" class="form" ${CAMPO} onsubmit="return false"><input type="hidden" name="hi" value="${esc(a.hi)}"><input type="hidden" name="mov" value="${esc(a.mov)}">${camposFim(r)}</form>`;
    rodape = `<button class="btn btn-sec" onclick="fecharModal()">Voltar</button><button class="btn btn-nav" id="bOk">Finalizar e salvar</button>`;
  } else if(modo === 'novo'){
    r = { data:hoje, hi:'', hf:agora, sku:0, vol:0, un:0, pal:0, div:'NÃO', obs:'' };
    titulo = 'Lançar operação concluída';
    corpo = `<form id="fOp" class="form" ${CAMPO} onsubmit="return false">${camposInicio(r)}${camposFim(r)}</form>`;
    rodape = `<button class="btn btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn btn-pri" id="bOk">Salvar lançamento</button>`;
  } else {
    r = rec || acharReg(id); if(!r){ toast('Registro não encontrado.', true); return; }
    const dis = modo === 'ver';
    titulo = dis ? 'Lançamento' : 'Editar lançamento';
    corpo = `<form id="fOp" class="form" ${CAMPO} onsubmit="return false">${camposInicio(r, dis)}${camposFim(r, dis)}</form>
      ${r.ts ? `<p class="nota">Lançado em ${fmtDataHora(r.ts)}${r.email ? ' por ' + esc(r.email) : ''}${r.disp ? ' (aparelho ' + esc(r.disp) + ')' : ''}.</p>` : ''}${blocoEntrega(r)}`;
    rodape = dis ? `<button class="btn btn-sec" onclick="fecharModal()">Fechar</button>`
      : `<button class="btn btn-del esq" id="bDel">Excluir</button><button class="btn btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn btn-pri" id="bOk">Salvar alterações</button>`;
  }
  abrirModal(titulo, corpo + '<div id="fErro"></div>', rodape);
  const f = $('#fOp');
  const atualizaTempo = () => { const t = $('#tempoForm'); if(t && f.hi && f.hf) t.textContent = fmtDur(dur(f.hi.value, f.hf.value)); };
  const atualizaObs = () => {
    if(!f.obs) return;
    const dv = f.querySelector('input[name=div]:checked')?.value;
    const mov = f.mov ? f.mov.value : '';
    const auto = Object.values(OBS_AUTO).includes(f.obs.value.trim());
    if(dv === 'NÃO' && (!f.obs.value.trim() || auto)) f.obs.value = obsPadrao(mov);
    if(dv === 'SIM' && auto) f.obs.value = '';
    $('#obsDica').textContent = dv === 'SIM' ? '(obrigatório: descreva a divergência)' : '';
  };
  f.addEventListener('input', e => { if(e.target.name === 'hi' || e.target.name === 'hf') atualizaTempo(); });
  f.addEventListener('change', e => { if(e.target.name === 'div' || e.target.name === 'mov') atualizaObs(); });
  atualizaTempo(); if(modo !== 'ver') atualizaObs();
  const bOk = $('#bOk'); if(bOk) bOk.onclick = () => salvarForm(modo, id, r);
  const bDel = $('#bDel'); if(bDel) bDel.onclick = () => excluirReg(r);
  const bEnt = $('#bEnt'); if(bEnt) bEnt.onclick = () => abrirEntrega(r.id, r);
  const bDesf = $('#bDesf'); if(bDesf) bDesf.onclick = () => desfazerEntrega(r);
  const primeiro = f.querySelector('select:not([disabled]),input:not([type=hidden]):not([disabled])'); if(primeiro && modo !== 'finalizar') primeiro.focus();
}
/* detalhe: usa o que já está na memória; se o mês não estiver carregado, busca só esse registro (once + timeout) */
async function abrirRegistro(id, mes){
  let r = acharReg(id);
  if(!r && mes && root){
    try{ progresso('Buscando o lançamento…'); const s = await comTimeout(root.child('mov/' + mes + '/' + id).once('value'), 15000, 'O banco não respondeu. Verifique a conexão.'); if(s.val()) r = normReg(s.val(), id); }
    catch(e){ toast(e.message, true); } finally { progressoFim(); }
  }
  if(!r){ toast('Lançamento não encontrado.', true); return; }
  abrirForm(isAdmin() ? 'editar' : 'ver', id, r);
}
function lerForm(){
  const f = $('#fOp'), o = {};
  f.querySelectorAll('input,select').forEach(el => {
    if(!el.name) return;
    if(el.type === 'radio'){ if(el.checked) o[el.name] = el.value; } else o[el.name] = el.value;
  });
  ['sku','vol','un','pal'].forEach(k => { if(k in o) o[k] = Number(o[k] || 0); });
  if(o.hi && o.hi.length === 5) o.hi += ':00';
  if(o.hf && o.hf.length === 5) o.hf += ':00';
  return o;
}
function erroForm(msg){ $('#fErro').innerHTML = `<div class="erro">${esc(msg)}</div>`; }

/* ── gravações de lançamento ── */
const pathReg = r => 'mov/' + r.data.slice(0,7) + '/' + r.id;
const CAMPOS_REG = ['id','data','hi','hf','cliente','mov','colab','nf','sku','vol','un','pal','div','obs','stEnt','entPor','entData','entHora','entObs','ts','email','disp','upd'];
function recLimpo(r){ const o = {}; CAMPOS_REG.forEach(k => { const v = r[k]; o[k] = (v === '' || v === undefined) ? null : v; }); return o; }
function baseReg(reg){
  return { data:reg.data, hi:reg.hi, hf:reg.hf, cliente:up(reg.cliente), mov:up(reg.mov), colab:up(reg.colab), nf:String(reg.nf || '').trim(),
    sku:+reg.sku || 0, vol:+reg.vol || 0, un:+reg.un || 0, pal:+reg.pal || 0, div:reg.div === 'SIM' ? 'SIM' : 'NÃO', obs:String(reg.obs || '').trim() };
}
function validarReg(r){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.data || '')) throw new Error('Preencha a data.');
  ['hi','hf','cliente','mov','colab'].forEach(k => { if(!r[k]) throw new Error('Preencha: ' + ({ hi:'Hora inicial', hf:'Hora final', cliente:'Cliente', mov:'Movimento', colab:'Colaborador' })[k] + '.'); });
}
function opsGravarReg(rec, antigo){
  const ops = [], mes = rec.data.slice(0,7);
  if(antigo && pathReg(antigo) !== pathReg(rec)) ops.push({ t:'del', p:pathReg(antigo) });
  ops.push({ t:'set', p:pathReg(rec), v:recLimpo(rec) });
  ops.push({ t:'set', p:'meses/' + mes, v:true });
  if(rec.stEnt === ST_AG) ops.push({ t:'set', p:'pendentes/' + rec.id, v:recLimpo(rec) });
  else if(antigo && antigo.stEnt === ST_AG) ops.push({ t:'del', p:'pendentes/' + rec.id });
  return ops;
}
function novoRegistro(reg, id){
  const rec = Object.assign(baseReg(reg), { id: id || novoId(), ts:Date.now(), email:S.user.usuario, disp:DISP });
  validarReg(rec);
  if(ehSeparacao(rec.mov)) rec.stEnt = ST_AG;
  return rec;
}
function salvarForm(modo, id, rOrig){
  const f = $('#fOp');
  if(!f.reportValidity()) return;
  const reg = lerForm();
  try{
    if(modo !== 'iniciar'){
      if(reg.div === 'SIM' && (!reg.obs || /sem diverg/i.test(reg.obs))) return erroForm('Descreva a divergência em Observações.');
      const d = dur(reg.hi, reg.hf);
      if(d != null && d > 12 * 3600 && !confirm('O tempo realizado passou de 12 horas (' + fmtDur(d) + '). Confirma os horários?')) return;
    }
    const msgSep = 'Pedido separado. Ele ficou em "Aguardando retirada".';
    if(modo === 'iniciar'){
      const novo = { data:reg.data, hi:reg.hi, cliente:up(reg.cliente), mov:up(reg.mov), colab:up(reg.colab), nf:String(reg.nf || '').trim(), usuario:S.user.usuario, inicio:Date.now(), disp:DISP };
      if(!novo.data || !novo.hi || !novo.cliente || !novo.mov || !novo.colab) return erroForm('Preencha todos os campos obrigatórios.');
      enqueue({ t:'set', p:'andamento/' + novoId(), v:novo });
      fecharModal(); toast('Operação iniciada.'); return;
    }
    if(modo === 'finalizar'){
      const a = D.andamento[id]; if(!a) return erroForm('Esta operação não está mais em andamento (talvez finalizada em outro aparelho).');
      const rec = novoRegistro(Object.assign({}, a, { hf:reg.hf, sku:reg.sku, vol:reg.vol, un:reg.un, pal:reg.pal, div:reg.div, obs:reg.obs }), id);
      enqueue(...opsGravarReg(rec), { t:'del', p:'andamento/' + id });
      fecharModal(); toast(rec.stEnt === ST_AG ? msgSep : 'Operação finalizada e salva.'); return;
    }
    if(modo === 'novo'){
      const rec = novoRegistro(reg);
      enqueue(...opsGravarReg(rec));
      fecharModal(); toast(rec.stEnt === ST_AG ? msgSep : 'Lançamento salvo.'); return;
    }
    if(modo === 'editar'){
      const ant = rOrig;
      const rec = Object.assign({}, ant, baseReg(reg), { upd:Date.now() });
      validarReg(rec);
      if(!ehSeparacao(rec.mov) && rec.stEnt === ST_AG) rec.stEnt = '';
      enqueue(...opsGravarReg(rec, ant));
      fecharModal(); toast('Alterações salvas.');
    }
  }catch(e){ erroForm(e.message); }
}
function excluirReg(r){
  if(!confirm(`Excluir o lançamento de ${r.cliente} em ${dataBR(r.data)} (${r.mov})?`)) return;
  enqueue({ t:'del', p:pathReg(r) }, { t:'del', p:'pendentes/' + r.id });
  fecharModal(); toast('Lançamento excluído.');
}

/* ══════════ ENTREGA / RETIRADA ══════════ */
function blocoEntrega(r){
  if(r.stEnt === ST_AG) return `<div class="ent-box"><div class="tx"><b>Aguardando retirada</b>Separado em ${dataBR(r.data)} às ${esc(r.hf.slice(0,5))}, há ${fmtEspera((Date.now() - fimSeparacao(r)) / 1000)}.</div>
    <button type="button" class="btn btn-pri" id="bEnt">Registrar entrega</button></div>`;
  if(r.stEnt === ST_EN) return `<div class="ent-box"><div class="tx"><b>Entregue</b>Por ${esc(r.entPor)} em ${dataBR(r.entData)} às ${esc(r.entHora.slice(0,5))}${tempoRetirada(r) != null ? ' (' + fmtEspera(tempoRetirada(r)).replace(/:\d\d$/, '') + ' após a separação)' : ''}.
    ${r.entObs ? `<br>Observação: ${esc(r.entObs)}` : ''}</div>${isAdmin() ? '<button type="button" class="btn btn-sec" id="bDesf">Desfazer entrega</button>' : ''}</div>`;
  return '';
}
function abrirEntrega(id, rec){
  const r = rec || acharReg(id); if(!r){ toast('Pedido não encontrado.', true); return; }
  abrirModal('Registrar entrega', `
    <div class="resumo-op"><div class="cli">${esc(r.cliente)}</div>
      <div class="meta">${esc(r.nf || 'Sem nº de pedido')} | ${nf(r.vol)} volumes | ${nf(r.un)} unidades${r.pal ? ' | ' + nf(Math.abs(r.pal)) + ' pallets' : ''}<br>
      Separado por ${esc(r.colab)} em ${dataBR(r.data)} às ${esc(r.hf.slice(0,5))}</div></div>
    <form id="fEnt" class="form" ${CAMPO} onsubmit="return false">
      <label class="f full"><span>Quem entregou<em>*</em></span>${selectCad('por','colaboradores','')}</label>
      <label class="f"><span>Dia<em>*</em></span><input class="in" type="date" name="data" value="${hojeISO()}" required></label>
      <label class="f"><span>Horário<em>*</em></span><input class="in" type="time" step="1" name="hora" value="${agoraHora()}" required></label>
      <label class="f full"><span>Observação da entrega</span>
        <textarea class="in" name="px-ent-obs" ${CAMPO} rows="3" placeholder="Ex.: retirado pelo motorista da transportadora, placa, volume avariado, entrega parcial…"></textarea></label>
    </form><div id="fErro"></div>`,
    `<button class="btn btn-sec" onclick="fecharModal()">Voltar</button><button class="btn btn-pri" id="bOk">Confirmar entrega</button>`);
  $('#bOk').onclick = () => {
    const f = $('#fEnt'); if(!f.reportValidity()) return;
    const atual = acharReg(id) || r;
    if(atual.stEnt === ST_EN) return erroForm('Este pedido já teve a entrega registrada (talvez em outro aparelho).');

/* ═══════════ APPS SCRIPT (só backup) ═══════════ */
async function lerJson(r){
  const t = await r.text(); let j;
  try{ j = JSON.parse(t); }
  catch(e){
    const m = t.match(/<title>([^<]*)<\/title>/i);
    let dica = 'Confira a URL /exec e se a implantação está como "Qualquer pessoa".';
    if(/accounts\.google\.com|ServiceLogin/i.test(t)) dica = 'Ela pediu login: a implantação precisa estar liberada para "Qualquer pessoa".';
    else if(/doGet|doPost|não encontrada|not found/i.test(t)) dica = 'O código não foi encontrado: cole o Code.gs e publique uma Nova versão.';
    throw new Error('A planilha respondeu com uma página de erro do Google' + (m ? ' ("' + m[1].trim().slice(0,80) + '")' : '') + '. ' + dica);
  }
  if(!j.ok) throw new Error(j.erro || 'Erro no Apps Script.');
  return j;
}
async function gsGet(params){
  const u = bkpUrl(); if(!u) throw new Error('Configure a URL do backup (Apps Script).');
  let r;
  try{ r = await fetch(u + '?' + new URLSearchParams(Object.assign({ token:BACKUP_TOKEN }, params))); }
  catch(e){ throw new Error('Sem conexão com a planilha de backup.'); }
  return lerJson(r);
}
async function gsPost(body){
  const u = bkpUrl(); if(!u) throw new Error('Configure a URL do backup (Apps Script).');
  let r;
  try{ r = await fetch(u, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(Object.assign({ token:BACKUP_TOKEN }, body)) }); }
  catch(e){ throw new Error('Sem conexão com a planilha de backup.'); }
  return lerJson(r);
}

/* ═══════════ FORMATO DO BACKUP ═══════════
   tipos de coluna: '@' texto | 'n' número | 'b' SIM/NÃO | 'd' data (ms + legível) | 't' data/hora (ms + legível) */
const TAB = {
  MOV: [['id','ID','@'],['data','DATA','d'],['hi','HORA INICIAL','@'],['hf','HORA FINAL','@'],['cliente','CLIENTE','@'],['mov','MOVIMENTO','@'],
        ['colab','COLABORADOR','@'],['nf','NF/ DI/ PED','@'],['sku','QTD DE SKU','n'],['vol','QTD DE VOLUMES','n'],['un','QTD DE UNIDADES','n'],
        ['pal','QTD DE PALLETS','n'],['div','DIVERGENCIA','@'],['obs','OBSERVAÇÕES','@'],['stEnt','STATUS ENTREGA','@'],['entPor','ENTREGUE POR','@'],
        ['entData','DATA ENTREGA','d'],['entHora','HORA ENTREGA','@'],['entObs','OBS ENTREGA','@'],['ts','LANÇADO EM','t'],['email','LANÇADO POR','@'],
        ['disp','DISPOSITIVO','@'],['upd','ALTERADO EM','t']],
  ANDAMENTO: [['id','ID','@'],['data','DATA','d'],['hi','HORA INICIAL','@'],['cliente','CLIENTE','@'],['mov','MOVIMENTO','@'],['colab','COLABORADOR','@'],
              ['nf','NF/ DI/ PED','@'],['usuario','USUÁRIO','@'],['inicio','INÍCIO','t'],['disp','DISPOSITIVO','@']],
  CADASTROS: [['tipo','TIPO','@'],['key','CHAVE','@'],['nome','NOME','@'],['ativo','ATIVO','b']],
  USUARIOS: [['login','USUÁRIO','@'],['nome','NOME','@'],['senha','SENHA','@'],['perfil','PERFIL','@'],['ativo','ATIVO','b']],
  OCUPACAO: [['mes','MÊS','@'],['key','CHAVE','@'],['cliente','CLIENTE','@'],['pallets','PALLETS','n']]
};
function cabDe(spec){ const c = [], f = []; spec.forEach(([, h, t]) => {
  if(t === 'd' || t === 't'){ c.push(h + ' (MS)', h); f.push('ms', '@'); } else { c.push(h); f.push(t === 'n' ? 'n' : '@'); } }); return { cab:c, fmt:f }; }
function linhaDe(spec, o){ const l = []; spec.forEach(([k, , t]) => { const v = o[k];
  if(t === 'd'){ l.push(v ? isoParaMs(v) : '', v ? dataBR(v) : ''); }
  else if(t === 't'){ l.push(v ? +v : '', v ? fmtDataHora(v) : ''); }
  else if(t === 'n') l.push(Number(v) || 0);
  else if(t === 'b') l.push(v === false ? 'NÃO' : 'SIM');
  else l.push(v == null ? '' : String(v)); }); return l; }
function objDe(spec, cab, linha){
  const ix = {}; cab.forEach((h, i) => { ix[String(h)] = i; });
  const g = h => ix[h] == null ? '' : linha[ix[h]];
  const o = {};
  spec.forEach(([k, h, t]) => {
    if(t === 'd'){ const ms = g(h + ' (MS)'); let iso = (ms !== '' && ms != null) ? msParaIso(ms) : '';
      if(!iso){ const m = String(g(h)).match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) iso = m[3] + '-' + m[2] + '-' + m[1]; } o[k] = iso || null; }
    else if(t === 't'){ const ms = g(h + ' (MS)'); o[k] = (ms === '' || ms == null || isNaN(+ms)) ? null : +ms; }
    else if(t === 'n') o[k] = Number(g(h)) || 0;
    else if(t === 'b') o[k] = up(g(h)) !== 'NÃO' && g(h) !== false;
    else { const v = g(h); o[k] = v == null ? '' : String(v); }
  });
  return o;
}
function montarTabelas(all){
  const t = { MOV:[], ANDAMENTO:[], CADASTROS:[], USUARIOS:[], OCUPACAO:[] };
  Object.entries(all.mov || {}).forEach(([m, o]) => Object.entries(o || {}).forEach(([id, r]) => t.MOV.push(normReg(r, id))));
  Object.entries(all.andamento || {}).forEach(([id, a]) => t.ANDAMENTO.push(Object.assign({}, a, { id })));
  Object.entries(all.cad || {}).forEach(([tipo, o]) => Object.entries(o || {}).forEach(([key, x]) => t.CADASTROS.push({ tipo, key, nome:x.nome, ativo:x.ativo !== false })));
  Object.entries(all.usuarios || {}).forEach(([login, u]) => t.USUARIOS.push(Object.assign({}, u, { login })));
  Object.entries(all.ocupacao || {}).forEach(([mes, o]) => Object.entries(o || {}).forEach(([key, x]) => t.OCUPACAO.push({ mes, key, cliente:x.cliente, pallets:x.pallets })));
  const out = {};
  Object.keys(t).forEach(tp => { const c = cabDe(TAB[tp]); out[tp] = { cab:c.cab, fmt:c.fmt, linhas:t[tp].map(o => linhaDe(TAB[tp], o)) }; });
  return out;
}
/* converte um objeto de backup/importação em caminhos de gravação */
function caminhosDe(tipo, o, mapa){
  if(tipo === 'MOV'){
    const r = normReg(o, o.id); if(!r.id || !r.data) return;
    mapa[pathReg(r)] = recLimpo(r); mapa['meses/' + r.data.slice(0,7)] = true;
    if(r.stEnt === ST_AG) mapa['pendentes/' + r.id] = recLimpo(r);
  } else if(tipo === 'ANDAMENTO'){
    if(!o.id) return; const a = Object.assign({}, o); delete a.id; Object.keys(a).forEach(k => { if(a[k] === '') a[k] = null; }); mapa['andamento/' + chave(o.id)] = limpa(a);
  } else if(tipo === 'CADASTROS'){
    if(!o.tipo || !o.nome) return; mapa['cad/' + o.tipo + '/' + (o.key || chave(o.nome))] = { nome:o.nome, ativo:o.ativo !== false };
  } else if(tipo === 'USUARIOS'){
    if(!o.login) return; mapa['usuarios/' + chave(up(o.login))] = { nome:o.nome || o.login, senha:String(o.senha || ''), perfil:o.perfil === 'ADMIN' ? 'ADMIN' : 'OPERADOR', ativo:o.ativo !== false };
  } else if(tipo === 'OCUPACAO'){
    if(!o.mes || !o.cliente) return; mapa['ocupacao/' + o.mes + '/' + (o.key || chave(o.cliente))] = { cliente:o.cliente, pallets:Number(o.pallets) || 0 };
  }
}
/* grava direto (sem fila) em lotes de 500 caminhos */
async function gravarEmLotes(mapa, rotulo, base, peso){
  const ks = Object.keys(mapa);
  for(let i = 0; i < ks.length; i += 500){
    const lote = {}; ks.slice(i, i + 500).forEach(k => { lote[k] = limpa(mapa[k]); });
    await comTimeout(root.update(lote), 30000, 'O banco não confirmou a gravação a tempo. Verifique a conexão e tente de novo.');
    if(rotulo) progresso(rotulo + ' (' + Math.min(i + 500, ks.length) + ' de ' + ks.length + ' caminhos)', base + peso * Math.min(1, (i + 500) / ks.length));
  }
}
const exigeOnline = () => { if(!root || !authOk) throw new Error('O banco ainda não conectou.'); if(!conectado) throw new Error('Sem conexão com o banco de dados. Conecte o aparelho e tente de novo.'); };

/* ═══════════ BACKUP ═══════════ */
let ocupado = false;
async function iniciarBackup(){
  if(ocupado) return toast('Aguarde a tarefa em andamento terminar.', true);
  if(!confirm('Fazer agora um backup completo do banco na planilha?')) return;
  ocupado = true;
  try{
    exigeOnline();
    progresso('Lendo o banco de dados…', null);
    const snap = await comTimeout(root.once('value'), 60000, 'O banco não respondeu ao ler os dados para o backup.');
    const tabs = montarTabelas(snap.val() || {});
    const tipos = Object.keys(tabs).map(t => ({ tipo:t, cab:tabs[t].cab, fmt:tabs[t].fmt, total:tabs[t].linhas.length }));
    const total = tipos.reduce((s, t) => s + t.total, 0);
    progresso('Criando as abas do backup na planilha…', 0);
    const ini = await gsPost({ acao:'backup_inicio', dispositivo:DISP, tipos });
    let env = 0;
    for(const t of tipos){
      const L = tabs[t.tipo].linhas;
      for(let i = 0; i < L.length; i += 2500){
        await gsPost({ acao:'backup_parte', id:ini.id, tipo:t.tipo, linhas:L.slice(i, i + 2500) });   // uma parte por vez
        env += Math.min(2500, L.length - i);
        progresso('Enviando backup: ' + nf(env) + ' de ' + nf(total) + ' linhas', total ? env / total : 1);
      }
    }
    const totais = {}; tipos.forEach(t => { totais[t.tipo] = t.total; });
    const fim = await gsPost({ acao:'backup_fim', id:ini.id, totais });
    enqueue({ t:'set', p:'meta/ultimoBackup', v:{ id:ini.id, ms:Date.now(), status:fim.status, disp:DISP, total } });
    progressoFim();
    if(fim.status === 'OK') toast('Backup concluído: ' + nf(total) + ' linhas gravadas (' + ini.id + ').');
    else alert('Backup INCOMPLETO.\n' + (fim.obs || '') + '\nTente fazer o backup de novo.');
  }catch(e){ progressoFim(); alert('Backup não concluído.\n' + e.message); }
  finally{ ocupado = false; }
}

      <div class="f full"><span style="font-weight:600;font-size:13px">2. Como restaurar</span>

          <label class="radio"><input type="radio" name="modo" value="mesclar" checked><span><b>Mesclar (recomendado)</b><br><span class="dica">Recoloca o que está no backup e mantém o que foi lançado depois dele.</span></span></label>
          <label class="radio"><input type="radio" name="modo" value="substituir"><span><b>Substituir tudo</b><br><span class="dica">Apaga o banco atual e deixa exatamente como estava no backup.</span></span></label>
        </div></div>
      <label class="f full"><span>3. Senha de restauração<em>*</em></span><input class="in senha" type="text" name="px-rest-pin" ${CAMPO} required></label>
    </form><div id="fErro"></div>`,
    `<button class="btn btn-sec" onclick="fecharModal()">Cancelar</button><button class="btn btn-pri" id="bOk">Restaurar</button>`);
  $('#bOk').onclick = async () => {

    const id = f.querySelector('input[name=bk]:checked').value, modo = f.querySelector('input[name=modo]:checked').value;
    const b = lista.find(x => x.id === id);
    if(modo === 'substituir' && !confirm('SUBSTITUIR TUDO: o banco atual será apagado e trocado pelo backup de ' + b.dataTxt + '. Confirma?')) return;

async function restaurar(b, modo){
  ocupado = true;
  try{
    exigeOnline();
    if(lerFila().length) throw new Error('Há ' + lerFila().length + ' gravação(ões) deste aparelho ainda na fila. Toque em "Enviar agora" e tente de novo.');
    const tipos = Object.keys(TAB).filter(t => b.qtd[t] != null);
    const total = tipos.reduce((s, t) => s + (b.qtd[t] || 0), 0) || 1;
    const mapa = {}; let lidas = 0;
    for(const t of tipos){
      let de = 0;
      for(;;){
        const j = await gsGet({ acao:'backup_ler', id:b.id, tipo:t, de, qtd:3000 });   // uma parte por vez
        j.linhas.forEach(l => caminhosDe(t, objDe(TAB[t], j.cab, l), mapa));
        de += j.linhas.length; lidas += j.linhas.length;
        progresso('Lendo o backup: ' + nf(lidas) + ' de ' + nf(total) + ' linhas', 0.5 * lidas / total);
        if(j.fim || !j.linhas.length) break;
      }
    }
    if(modo === 'substituir'){
      progresso('Apagando os dados atuais…', 0.5);
      await comTimeout(root.update({ mov:null, pendentes:null, meses:null, andamento:null, cad:null, usuarios:null, ocupacao:null }), 30000, 'O banco não confirmou a limpeza.');
    }
    await gravarEmLotes(mapa, 'Gravando no banco', 0.5, 0.5);
    progressoFim();
    toast('Backup restaurado (' + (modo === 'substituir' ? 'substituir tudo' : 'mesclar') + '): ' + nf(lidas) + ' linhas.');
  }catch(e){ progressoFim(); alert('Restauração não concluída.\n' + e.message); }
  finally{ ocupado = false; }
}

async function executarImportacao(q){

    exigeOnline();
    const total = Object.values(q).reduce((s, v) => s + v, 0) || 1; let feitos = 0, gravados = 0;
    for(const t of ['CADASTROS','USUARIOS','OCUPACAO','ANDAMENTO','MOV']){
      const lote = t === 'MOV' ? 100 : 1000;
      let de = 0;
      for(;;){
        const j = await gsGet({ acao:'mig_ler', tipo:t, de, qtd:lote, ano:new Date().getFullYear() });   // um pedido por vez
        const mapa = {};
        j.itens.forEach(o => caminhosDe(t, o, mapa));
        if(Object.keys(mapa).length) await gravarEmLotes(mapa);
        gravados += j.itens.length;
        feitos += t === 'MOV' ? Math.min(lote, Math.max(j.total - de, 0)) : (q[t] || 0);
        progresso('Importando ' + t + ': ' + nf(Math.min(feitos, total)) + ' de ' + nf(total), feitos / total);
        de += lote;
        if(j.fim) break;
      }
    }
    progressoFim();
    toast('Importação concluída: ' + nf(gravados) + ' itens gravados no banco.');
  }catch(e){ progressoFim(); alert('Importação não concluída.\n' + e.message); }
  finally{ ocupado = false; }
}

/* ═══════════ REENVIAR DADOS DESTE APARELHO ═══════════ */
async function reenviarAparelho(){
  fecharModal();
  const d = store.get(K.diario, []);
  if(!d.length) return toast('Este aparelho não tem gravações registradas.');
  try{
    exigeOnline();
    let faltando = 0;
    for(let i = 0; i < d.length; i += 25){
      progresso('Conferindo o que este aparelho gravou: ' + Math.min(i + 25, d.length) + ' de ' + d.length, i / d.length);
      const lote = d.slice(i, i + 25);
      const snaps = await comTimeout(Promise.all(lote.map(x => root.child(x.p).once('value'))), 30000, 'O banco não respondeu.');
      const ops = [];
      snaps.forEach((s, k) => {
        if(s.exists()) return;
        const x = lote[k]; faltando++;
        ops.push({ t:'set', p:x.p, v:x.v });
        if(/^mov\//.test(x.p) && x.v){ ops.push({ t:'set', p:'meses/' + x.p.split('/')[1], v:true }); if(x.v.stEnt === ST_AG) ops.push({ t:'set', p:'pendentes/' + x.v.id, v:x.v }); }
      });
      if(ops.length) enqueue(...ops);
    }
    progressoFim();
    toast(faltando ? faltando + ' registro(s) que não estavam no banco foram colocados na fila de envio.' : 'Tudo o que este aparelho gravou já está no banco.');
  }catch(e){ progressoFim(); alert(e.message); }
}

/* ═══════════ MODAL ═══════════ */
function abrirModal(titulo, corpo, rodape){
  fecharModal();
  const d = document.createElement('div'); d.className = 'fundo'; d.id = 'modal';
  d.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="modal-cab"><h3>${esc(titulo)}</h3><button onclick="fecharModal()" aria-label="Fechar">×</button></div>
    <div class="modal-corpo">${corpo}</div>${rodape ? `<div class="modal-rod">${rodape}</div>` : ''}</div>`;
  d.addEventListener('mousedown', e => { if(e.target === d) fecharModal(); });
  document.body.appendChild(d); document.body.style.overflow = 'hidden';
}
function fecharModal(){ const m = $('#modal'); if(m) m.remove(); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if($('#modal')) fecharModal(); else if(S.menu){ S.menu = false; render(); } } });
document.addEventListener('click', e => { if(S.menu && !e.target.closest('.menu')){ S.menu = false; render(); } });

/* ── pós-render, busca e cronômetros ── */
function posRender(posBusca){
  const b = document.querySelector('input[name="px-busca-lanc"]');
  if(!b) return;
  if(b.value.indexOf('@') >= 0){ b.value = ''; S.f.q = ''; }   // o navegador preencheu um e-mail: limpa
  if(posBusca != null){ b.focus(); try{ b.setSelectionRange(posBusca, posBusca); }catch(_){} }
  let t;
  b.oninput = () => { clearTimeout(t); t = setTimeout(() => { S.f.q = b.value.indexOf('@') >= 0 ? '' : b.value; render(); }, 300); };
}
function tick(){
  document.querySelectorAll('[data-start]').forEach(el => {
    const s = (Date.now() - new Date(el.dataset.start).getTime()) / 1000;
    const txt = el.dataset.fmt === 'espera' ? fmtEspera(s) : fmtDur(s);
    if(el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('longo', s > (+el.dataset.lim || 4 * 3600));
  });
}
setInterval(tick, 1000);

/* ── início ── */
(function(){
  iniciarFirebase();
  const sess = store.get(K.sess, null);
  if(sess && sess.usuario){ S.user = sess; render(); } else telaLogin();
})();
